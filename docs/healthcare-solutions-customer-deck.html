function flowHtml(steps, outputs){
  const chips = steps.map((s,i)=>{
    const arrow = i < steps.length-1 ? `<span class="farrow">→</span>` : "";
    return `<div class="fchip">${s[0]}<small>${s[1]}</small></div>${arrow}`;
  }).join("");
  const out = outputs.map(o=>`<span class="otag">${o}</span>`).join("");
  return `<div class="flowline">${chips}</div><div class="outputs">${out}</div>`;
}

const RTYPE = { nb:"Notebook", pipe:"Pipeline", lh:"Lakehouse", sm:"Semantic model", rpt:"Power BI report" };
function deployHtml(items){
  const rows = items.map(([name,tk])=>
    `<div class="deploy-row"><span class="rname">${name}</span><span class="rtype rt-${tk}">${RTYPE[tk]}</span></div>`
  ).join("");
  return `<div class="deploy-list">${rows}</div>`;
}

function solutionSlide(s){
  const pill = s.avail==="preview"
    ? `<span class="avail avail-preview">◆ Public preview</span>`
    : `<span class="avail avail-ga">✓ Generally available</span>`;
  const mandateTag = s.mandate ? `<span class="avail avail-req">★ Required foundation</span>` : "";
  const mandateBanner = s.mandate ? `<div class="mandate">★ <span><b>Mandatory.</b> ${s.mandate}</span></div>` : "";
  const does = s.does.map(t=>`<li>${t}</li>`).join("");
  const value = s.value.map(t=>`<li>${t}</li>`).join("");
  const dep = s.dep ? `<div class="dep">${s.dep}</div>` : "";
  return `<section class="slide" data-key="${s.key}">
    <div class="slide-head">
      <span class="idx">${s.n}</span>
      <div><h2>${s.title}</h2><div class="sub">${s.sub}</div></div>
      <div class="pills">${mandateTag}${pill}</div>
    </div>
    ${mandateBanner}
    <div class="body">
      <div class="col">
        <div class="card grow">
          <h3><span class="dot dot-do"></span>What this solution does</h3>
          <ul>${does}</ul>
        </div>
        <div class="card grow">
          <h3><span class="dot dot-deploy"></span>What this solution deploys</h3>
          ${deployHtml(s.deploys)}
        </div>
      </div>
      <div class="col">
        <div class="card">
          <h3><span class="dot dot-flow"></span>How the data flows &amp; what it produces</h3>
          ${flowHtml(s.flow, s.outputs)}
          ${dep}
        </div>
        <div class="card value">
          <h3><span class="dot dot-value"></span>What you get</h3>
          <ul>${value}</ul>
        </div>
      </div>
    </div>
  </section>`;
}

stage.innerHTML = titleSlide + foundationSlide + SOLUTIONS.map(solutionSlide).join("");

/* agenda buttons on title */
const agenda = document.getElementById("agenda");
agenda.innerHTML = SOLUTIONS.map((s,i)=>{
  const tag = s.mandate ? `<span class="s req">★ Required</span>`
    : s.avail==="preview" ? `<span class="s soon">Preview</span>`
    : `<span class="s now">GA</span>`;
  return `<button data-go="${i+2}"><span class="n">${s.n}</span>${s.title}${tag}</button>`;
}).join("");

/* ============ NAV ============ */
const slides = Array.from(stage.querySelectorAll(".slide"));
let cur = 0;
const progress = document.getElementById("progress");
const curEl = document.getElementById("cur");
const totalEl = document.getElementById("total");
totalEl.textContent = slides.length;

function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,idx)=>s.classList.toggle("active", idx===cur));
  curEl.textContent = cur+1;
  progress.style.width = ((cur+1)/slides.length*100)+"%";
  const act = stage.querySelector(".slide.active"); if (act) act.scrollTop = 0;
}
const next=()=>show(cur+1), prev=()=>show(cur-1);

document.getElementById("nextBtn").onclick = next;
document.getElementById("prevBtn").onclick = prev;
agenda.addEventListener("click", e=>{
  const b = e.target.closest("button[data-go]");
  if (b) show(parseInt(b.dataset.go,10));
});

document.addEventListener("keydown", e=>{
  if (e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); next(); }
  else if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if (e.key==="Home"){ show(0); }
  else if (e.key==="End"){ show(slides.length-1); }
  else if (e.key.toLowerCase()==="f"){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

show(0);
</script>
