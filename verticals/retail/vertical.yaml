id: retail
name: Retail
description: E-commerce retailer with online store, physical inventory, and customer analytics. Demonstrates transactional databases, analytics warehouse, and real-time inventory.
status: in-progress
scale_options:
  - small
  - medium
  - large
azure_services:
  - Azure SQL Database (transactional - orders, customers, products)
  - Azure Cosmos DB (session state, shopping cart)
  - Azure Data Lake Storage Gen2 (raw + curated zones)
  - Microsoft Fabric (analytics, Power BI)
  - Azure Event Hub (clickstream events)
  - Microsoft Purview (governance, catalog)
executive_kpis:
  - Revenue by day / week / month
  - Top selling products
  - Inventory turnover rate
  - Customer lifetime value
  - Cart abandonment rate
  - Geographic sales distribution
